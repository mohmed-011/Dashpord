 <div class="flex items-center justify-between pb-5">
    <h2 class="text-3xl font-[500]">Favorites</h2>
</div>
<div class=" rounded-md border my-6 flex flex-wrap w-fit ">
  <div class="px-5 py-2.5 border-r">
    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
  <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M18.796 4H5.204a1 1 0 0 0-.753 1.659l5.302 6.058a1 1 0 0 1 .247.659v4.874a.5.5 0 0 0 .2.4l3 2.25a.5.5 0 0 0 .8-.4v-7.124a1 1 0 0 1 .247-.659l5.302-6.059c.566-.646.106-1.658-.753-1.658Z"/>
</svg>
</div>
  <div class="px-5 py-2.5 border-r">
    <p class="font-[500]">Filter By</p>
  </div>
  <div class="px-5 py-2.5 border-r  flex-wrap flex items-center justify-between">
     <p class="font-[500] pe-5 cursor-pointer">Category</p>
     <i class="fa-solid fa-chevron-down cursor-pointer"></i>

  </div>
  <div class="px-5 py-2.5 border-r  flex-wrap flex items-center justify-between">
    <p class="font-[500] pe-5 cursor-pointer">Price</p>
    <i class="fa-solid fa-chevron-down cursor-pointer"></i>
  </div>
  <div class="px-5 py-2.5 border-r  flex-wrap flex items-center justify-between">
    <i class="fa-solid w-[2px] fa-arrow-rotate-left text-red-600"></i>
    <p class="font-[500] ps-5 cursor-pointer text-red-600">Reset</p>

  </div>
</div>
<div class="flex flex-wrap gap-y-4 mb-5  ">
@for (item of [1,2,3,4,5]; track $index) {
            <div class="lg:w-[25%] md:w-4/12 sm:w-6/12  px-2 py-3">


              <div class=" hover:scale-[1.05] transition-all duration-[0.5s] bg-white p-3 rounded-lg shadow-lg">
                <owl-carousel-o [options]="customOptionsCat">
                  @for (item of [1,2,3]; track $index) {
                  <ng-template carouselSlide>
                    <div  class="text-center cursor-pointer">
                      <img src="../../../assets/images/OIP.jpeg" [alt]=""  class="w-full h-[200px] rounded-md" />
                    </div>
                  </ng-template>
                  }
                </owl-carousel-o>

                <h5 class="my-2 font-[500]">Apple Watch Series 4</h5>
                <div class="flex justify-between">
                  <p class=" my-1 text-[#4880FF] font-[500] ">1200$</p>
                  <div class="cursor-pointer  p-1 rounded-full color1 d-flex items-center justify-center">
                    <i class="fa-regular fa-heart "></i>
                  </div>

                </div>

                <div class="flex my-2">
                  <i class="fa-solid fa-star text-yellow-400"></i>
                  <i class="fa-solid fa-star text-yellow-400"></i>
                  <i class="fa-solid fa-star text-yellow-400"></i>
                  <i class="fa-solid fa-star-half-stroke text-yellow-400"></i>
                  <i class="fa-regular fa-star text-yellow-400"></i>
                </div>
                <button class=" bg-slate-100 text-sm font-[500] rounded-md px-3 py-1 my-2 ">Edit product</button>
              </div>
            </div>
}
</div>
