<div
  class="mx-auto bg-white dark:bg-zinc-800 shadow-lg rounded-lg overflow-hidden"
>
  <div class="flex flex-col h-[500px]">
    <div class="px-4 py-3 border-b dark:border-zinc-700">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-zinc-800 dark:text-white">
          ChatGPT <span class="text-sm">plus</span>
        </h2>
        <div class="bg-green-500 text-white text-xs px-2 py-1 rounded-full">
          Online
        </div>
      </div>
    </div>

    <div
      class="flex-1 p-5 overflow-y-auto flex flex-col space-y-4"
      id="chatDisplay"
    >
      <div class="mx-auto">
        <img
          src="../../../assets/images/icons8-chatgpt-100.png"
          class="w-full"
          alt=""
        />
      </div>

 <div
  *ngFor="let msg of messages"
  [ngClass]="{
    'self-start bg-zinc-500': msg.from === 'user',
    'self-end bg-[#4880ff]': msg.from === 'bot'
  }"
  class="chat-message text-white max-w-xs rounded-lg px-4 py-2.5"
>
  <p class="text-[18px]">{{ msg.text }}</p>
</div>


    </div>
    <div class="px-3 py-3 border-t-2 dark:border-zinc-700">
      <div class="flex gap-2">
         <form class="w-full flex" [formGroup]="MassageForm" (ngSubmit)="SendMassage()" >


        <input
          formControlName="message"
          placeholder="Type your message..."
          name="message"
          class="w-full  flex-1 p-2 border-2 rounded-lg dark:bg-zinc-700 dark:text-white dark:border-zinc-600 text-sm"
          id="chatInput"
          type="text"
        />
        <button
          type="submit"
          class="bg-blue-500 hover:bg-blue-700 text-white font-[500] py-1.5 px-3 rounded-lg transition duration-300 ease-in-out text-sm"
          id="sendButton"
        >
          Send
        </button>
         </form>
      </div>
    </div>
  </div>
</div>
