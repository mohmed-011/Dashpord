<div class="flex justify-end mb-4">
  <button
    (click)="showFilters = true"
    class="bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white px-6 py-2 rounded-full shadow-lg transition-all duration-300"
  >
    <i class="fa-solid fa-sliders mr-2"></i> Filters
  </button>
</div>

<!-- Overlay -->
@if (showFilters) {
<div
  class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center transition-opacity duration-300"
>
  <!-- Modal -->
  <div
    class="bg-white w-full max-w-5xl mx-auto p-8 rounded-3xl shadow-2xl relative animate-fade-in"
  >
    <!-- Close Button -->
    <button
      (click)="showFilters = false"
      class="absolute top-5 right-5 text-gray-500 hover:text-red-600 text-xl transition duration-200"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <h2 class="text-2xl font-bold text-gray-800 mb-6">
      <i class="fa-solid fa-filter mr-2 text-blue-600"></i> Advanced Product
      Filters
    </h2>

    <form [formGroup]="filterForm">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Filter Inputs -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">Search</label>
          <input
            type="text"
            formControlName="searchQuery"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
        <div>
          <label for="countries"  for="countries" class="block text-sm text-gray-600 mb-1">Category</label>
          <select
      name="Category_ID"
      (change)="onCategoryChange($event)"
      formControlName="categry"

      id="countries"
      class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
    >
      <option  value=null selected>Select Category</option>
      @for (item of categoryList; track $index) {
      <option value="{{ item.Category_ID }}">
        {{ item.Category_Name }}
      </option>

      }
      <!-- <option value="1">Electronics</option>
      <option value="5">Home Appliances</option>
      <option value="9">Clothing</option>
      <option value="FR">Books</option>
      <option value="DE">Beauty</option>
      <option value="DE">Sports</option>
      <option value="DE">accessories</option>
      <option value="DE">Tools</option>
      <option value="DE">Furniture</option> -->
    </select>
        <div>
          <label for="countries2" class="block text-sm text-gray-600 mb-1">SubCategory</label>

          <select
      name="Sub_Category_ID"
      (change)="onSubCategoryChange($event)"
      id="countries2"
      formControlName="subCategry"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
    >
      <option  value=null selected>Select Sub Category</option>
      @for (item of subCategoryList; track $index) {
      <option value="{{ item.Sub_Category_ID }}">
        {{ item.Sub_Category_Name }}
      </option>

      }
      <!-- <option value="1">Smartphones</option>
      <option value="3">Tablets</option>
      <option value="2">Laptops</option>
      <option value="FR">Refrigerators</option>
      <option value="DE">Clothing for Men</option>
      <option value="7">Tvs</option>
      <option value="4">SmartWatches</option>
      <option value="19">PCs</option> -->
    </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Min Price</label>
          <input
            type="number"
            formControlName="minPrice"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Max Price</label>
          <input
            type="number"
            formControlName="maxPrice"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Min Rate</label>
          <input
            type="number"
            formControlName="minRate"
            min="0"
            max="5"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
        <!-- Checkboxes -->
        <div class="col-span-1 flex items-center space-x-3">
          <input
            type="checkbox"
            formControlName="mostViewed"
            class="w-5 h-5 text-blue-600"
          />
          <label class="text-gray-700">Most Viewed</label>
        </div>
        <div class="col-span-1 flex items-center space-x-3">
          <input
            type="checkbox"
            formControlName="newwest"
            class="w-5 h-5 text-blue-600"
          />
          <label class="text-gray-700">Newest</label>
        </div>
        <div class="col-span-1 flex items-center space-x-3">
          <input
            type="checkbox"
            formControlName="mostSold"
            class="w-5 h-5 text-blue-600"
          />
          <label class="text-gray-700">Most Sold</label>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Page</label>
          <input
            type="number"
            formControlName="pageNumber"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Page Size</label>
          <input
            type="number"
            formControlName="pageSize"
            class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all"
          />
        </div>
      </div>

      <!-- Apply Button -->
      <div class="mt-8 text-right">
        <button
          type="button"
          (click)="applyFilters()"
          class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white px-6 py-2 rounded-xl shadow-md transition hover:scale-105"
        >
          <i class="fa-solid fa-check mr-2"></i> Apply Filters
        </button>
      </div>
    </div>
    </form>
  </div>
</div>
}

<div class="flex flex-wrap gap-y-4 mb-5">
  @for (item1 of productList.slice(0..20); track $index) {
  <div class="lg:w-[25%] md:w-4/12 sm:w-6/12 px-2 py-3">
    <div
      [routerLink]="['/details', item1.Data.Item_ID]"
      id="{{ item1.Data.Brand_ID }}"
      class="hover:scale-[1.05] transition-all duration-[0.5s] bg-white p-3 rounded-lg shadow-lg"
    >
      <owl-carousel-o [options]="customOptionsCat">
        @for (item of [1,2,3]; track $index) {
        <ng-template carouselSlide>
          <div class="text-center cursor-pointer">
            <img
              [attr.src]="
                'https://sm-ecommerce.runasp.net' + item1.Data.Image_Cover
              "
              [alt]=""
              class="w-full h-[200px] rounded-md"
            />
          </div>
        </ng-template>
        }
      </owl-carousel-o>

      <h5 class="my-2 font-[500]">{{ item1.Data.Item_Name }}</h5>
      <div class="flex justify-between">
        <p class="my-1 text-[#4880FF] font-[500]">
          {{ item1.Data.Price_out }}$
        </p>
        <div
          class="cursor-pointer p-1 rounded-full color1 d-flex items-center justify-center"
        >
          <i class="fa-regular fa-heart"></i>
        </div>
      </div>

      <div class="flex my-2">
        <i class="fa-solid fa-star text-yellow-400"></i>
        <i class="fa-solid fa-star text-yellow-400"></i>
        <i class="fa-solid fa-star text-yellow-400"></i>
        <i class="fa-solid fa-star-half-stroke text-yellow-400"></i>
        <i class="fa-regular fa-star text-yellow-400"></i>
      </div>
      <button class="bg-slate-100 text-sm font-[500] rounded-md px-3 py-1 my-2">
        Edit product
      </button>
    </div>
  </div>
  }
</div>
